[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vouch"
version = "0.1.0"
description = "Poisoning-resistant, verified-by-default distribution for ML models and datasets"
requires-python = ">=3.11"
dependencies = [
    "blake3>=1.0.0",
    "cryptography>=42.0.0",
    "rfc8785>=0.1.4",
    "aiohttp>=3.10.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.100.0",
]

[project.scripts]
vouch = "vouch.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
