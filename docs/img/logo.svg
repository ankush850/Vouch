<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-label="Vouch Logo - Verified by Default">
  <defs>
    <radialGradient id="bg-glow" cx="25%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0e1e38" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="check-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#131e33" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="240" rx="16" fill="url(#bg-glow)"/>
  <rect width="800" height="240" rx="16" fill="url(#grid)" opacity="0.6"/>
  <rect width="798" height="238" x="1" y="1" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Logo Mark Group -->
  <g transform="translate(100, 120)" filter="url(#soft-shadow)">
    <!-- Outer Hexagonal / Shield Geometric Ring -->
    <polygon points="0,-68 58.89,-34 58.89,34 0,68 -58.89,34 -58.89,-34" 
             fill="#081020" stroke="url(#shield-grad)" stroke-width="3.5" filter="url(#glow)"/>
    
    <!-- Inner Concentric Facets (Cryptographic Token / Seal) -->
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25" 
             fill="#0a1628" stroke="#1e3a5f" stroke-width="1.8"/>

    <!-- Dynamic Cryptographic Nodes / Keypins -->
    <circle cx="0" cy="-68" r="4.5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="58.89" cy="-34" r="4.5" fill="#06b6d4" filter="url(#glow)"/>
    <circle cx="58.89" cy="34" r="4.5" fill="#6366f1" filter="url(#glow)"/>
    <circle cx="0" cy="68" r="4.5" fill="#818cf8" filter="url(#glow)"/>
    <circle cx="-58.89" cy="34" r="4.5" fill="#06b6d4" filter="url(#glow)"/>
    <circle cx="-58.89" cy="-34" r="4.5" fill="#38bdf8" filter="url(#glow)"/>

    <!-- Central Verified Cryptographic Check Emblem -->
    <path d="M-20 2 L-6 16 L24 -14" fill="none" stroke="url(#check-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>

  <!-- Typography / Brand Name -->
  <g transform="translate(205, 128)">
    <!-- Eyebrow Tag -->
    <text x="0" y="-38" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="4.5" fill="#06b6d4">VERIFIED BY DEFAULT</text>
    
    <!-- Main Title -->
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="2" fill="url(#text-grad)">VOUCH</text>
    
    <!-- Subtitle / Guarantee -->
    <text x="2" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13.5" font-weight="500" letter-spacing="1.2" fill="#94a3b8">
      Poisoning-Resistant Distribution for ML Models &amp; Data
    </text>
  </g>

  <!-- Security Seal Pill Badge -->
  <g transform="translate(620, 48)">
    <rect width="140" height="28" rx="14" fill="#0b172a" stroke="#1e3a5f" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#10b981"/>
    <text x="28" y="18" font-family="ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="1" fill="#38bdf8">ED25519 · BLAKE3</text>
  </g>
</svg>
