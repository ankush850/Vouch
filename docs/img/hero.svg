<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="Vouch. Verified by default. Poisoning-resistant distribution for ML models and datasets. Trust the signature, never the transport.">
<defs>
  <pattern id="h-grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#0d1523" stroke-width="1"/>
  </pattern>
  <radialGradient id="h-vig" cx="24%" cy="50%" r="85%">
    <stop offset="0" stop-color="#0a1220"/><stop offset="1" stop-color="#04060b"/>
  </radialGradient>
  <radialGradient id="h-core" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".5"/>
    <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <filter id="h-glow" x="-120%" y="-120%" width="340%" height="340%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
  .h-eyebrow{fill:#22d3ee;font-size:11px;letter-spacing:5px}
  .h-word{fill:#f2fbff;font-size:58px;letter-spacing:6px;font-weight:700}
  .h-tag{fill:#8fb2cc;font-size:13px;letter-spacing:.1px}
  .h-motto{fill:#eef8ff;font-size:21px;letter-spacing:.2px;font-weight:600}
  .h-motto2{fill:#22d3ee;font-size:21px;letter-spacing:.2px;font-weight:600;filter:url(#h-glow)}
  .h-term{fill:#8fb2cc;font-size:11.5px;letter-spacing:.1px}
  .h-term .p{fill:#3f7d9c}
  .h-term .ok{fill:#39e6a0}
  .h-term .no{fill:#ff5c6b}
  .h-term .em{fill:#bfe9ff}
  .h-term .cy{fill:#22d3ee}
  .h-chip{fill:#080e18;stroke:#1c2b40;stroke-width:1}
  .h-chip-t{fill:#6f9ab8;font-size:8.5px;letter-spacing:1.3px}
  .h-mirrors{fill:#5b6b80;font-size:9px;letter-spacing:1.6px}
  .h-mirrors .cy{fill:#22d3ee}
  .h-star{fill:#96d2ff}

  .h-edge{stroke-width:1.5;fill:none}
  .h-e0{stroke:#4fb3ec}
  .h-e1{stroke:#5fdcff}
  .h-e2{stroke:#c3f4ff}
  .h-seam{animation:hseam 7s ease-in-out infinite;opacity:.7}
  @keyframes hseam{0%{opacity:.65}50%{opacity:1}100%{opacity:.65}}
  .h-vert{animation:hvert 7s ease-in-out infinite}
  @keyframes hvert{0%{opacity:.6}50%{opacity:1}100%{opacity:.6}}
  .h-orbit{animation:horbit linear infinite}
  @keyframes horbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .h-core{animation:hcore 5s ease-in-out infinite}
  @keyframes hcore{0%{opacity:.35}50%{opacity:.65}100%{opacity:.35}}

  @media (prefers-reduced-motion:reduce){
    .h-seam,.h-vert,.h-orbit,.h-core{animation:none}
    .h-seam{opacity:1}
    .h-vert{opacity:1}
  }
</style>
