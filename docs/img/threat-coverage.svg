<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 178" width="880" height="178" role="img" aria-label="Threat coverage. Every threat becomes a spec rule, an implementation, a property test, and a chaos test. A mitigation counts as done only when a test proves it fails closed.">
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#0d1523" stroke-width="1"/>
  </pattern>
  <radialGradient id="vig" cx="50%" cy="45%" r="85%">
    <stop offset="0" stop-color="#0a1220"/><stop offset="1" stop-color="#04060b"/>
  </radialGradient>
  <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
  .eyebrow{fill:#22d3ee;font-size:8.5px;letter-spacing:3.2px}
  .box{fill:#080e18;stroke:#1c2b40;stroke-width:1}
  .t{fill:#dbe5f0;font-size:10.5px;letter-spacing:1.5px}
  .s{fill:#4b5c72;font-size:8px;letter-spacing:.6px}
  .ar{stroke-width:1.3;fill:none;filter:url(#glow)}
  .cap{fill:#33465e;font-size:9px;letter-spacing:1.2px}
</style>
<rect width="880" height="178" fill="url(#vig)"/>
<rect width="880" height="178" fill="url(#grid)"/>
<text class="eyebrow" x="24" y="28">THREAT COVERAGE</text>

<rect class="box" x="24" y="52" width="148" height="62"/>
<rect x="24" y="52" width="148" height="2" fill="#ff3b1f"/>
<text class="t" x="98" y="80" text-anchor="middle">THREAT</text>
<text class="s" x="98" y="97" text-anchor="middle">named in the model</text>

<path class="ar" stroke="#ff3b1f" d="M176,83 H190 M184,78 L190,83 L184,88"/>

<rect class="box" x="195" y="52" width="148" height="62"/>
<rect x="195" y="52" width="148" height="2" fill="#ff7a18"/>
<text class="t" x="269" y="80" text-anchor="middle">SPEC</text>
<text class="s" x="269" y="97" text-anchor="middle">written as a rule</text>

<path class="ar" stroke="#ff7a18" d="M347,83 H361 M355,78 L361,83 L355,88"/>

<rect class="box" x="366" y="52" width="148" height="62"/>
<rect x="366" y="52" width="148" height="2" fill="#ffc531"/>
<text class="t" x="440" y="80" text-anchor="middle">IMPLEMENTATION</text>
<text class="s" x="440" y="97" text-anchor="middle">code that enforces it</text>

<path class="ar" stroke="#ffc531" d="M518,83 H532 M526,78 L532,83 L526,88"/>

<rect class="box" x="537" y="52" width="148" height="62"/>
<rect x="537" y="52" width="148" height="2" fill="#7dd8e8"/>
<text class="t" x="611" y="80" text-anchor="middle">PROPERTY TEST</text>
<text class="s" x="611" y="97" text-anchor="middle">tries to break the rule</text>

<path class="ar" stroke="#22d3ee" d="M689,83 H703 M697,78 L703,83 L697,88"/>

<rect class="box" x="708" y="52" width="148" height="62"/>
<rect x="708" y="52" width="148" height="2" fill="#22d3ee"/>
<text class="t" x="782" y="80" text-anchor="middle">CHAOS TEST</text>
<text class="s" x="782" y="97" text-anchor="middle">breaks the network too</text>

<text class="cap" x="24" y="148">A MITIGATION COUNTS AS DONE ONLY WHEN A TEST PROVES IT FAILS CLOSED.</text>
</svg>
